services:
  screener:
    image: crypto-screener-v2-screener:latest
    container_name: crypto-screener
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - CS_TELEGRAM_TOKEN=${CS_TELEGRAM_TOKEN}
      - CS_TELEGRAM_CHAT_ID=${CS_TELEGRAM_CHAT_ID}
      - CS_API_SECRET=${CS_API_SECRET}
      - CS_DATABASE_URL=sqlite+aiosqlite:////app/data/screener.db
    volumes:
      - screener_data:/app/data
    ports:
      - "9120:9120"
    healthcheck:
      test: ["CMD-SHELL", "python -u -c \"import urllib.request; urllib.request.urlopen('http://localhost:9120/health').status == 200\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  screener_data:
